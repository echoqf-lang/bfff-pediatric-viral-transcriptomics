    allowed_primary_timepoint: "acute primary timepoint; freeze in Task 4"
    outcome_previously_observed: false
    overlap_group: "NCH_RSV_longitudinal_possible_overlap"
    notes: "May contain five healthy technical replicates; no sample exclusion is performed in Task 3."
    downloads:
      - {filename: "GSE105450_quick.soft.txt", role: "official_quick_metadata", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE105450&targ=self&form=text&view=quick"}
