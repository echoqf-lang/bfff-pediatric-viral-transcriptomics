schema_version: 1
frozen_on: "2026-08-05"
case_direction: "RSV_minus_healthy"
raw_root: "data/raw"
metadata_output: "data/metadata/all_samples_raw.tsv"
checksum_output: "logs/checksums/geo_sha256.tsv"
policies:
  existing_geo_data_allowed: false
  overwrite_final_files: false
  outcome_driven_selection_allowed: false
  technical_replicate_exclusion_stage: "Task 4"
  default_network_mode: "reuse_only"
  automatic_download_allowed_roles: ["official_quick_metadata", "series_matrix", "non_normalized_expression", "raw_counts", "official_supplement_filelist"]
  automatic_download_forbidden_types: ["RAW.tar", "CEL", "CEL.gz", "FASTQ", "SRA"]
  missing_analysis_matrix_action: "stop_and_report; never substitute source files without new explicit user authorization"
  existing_source_files_action: "retain_read_only; list cleanup candidates; do not delete"
cohorts:
